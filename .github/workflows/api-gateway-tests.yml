name: API Gateway Tests

on:
  push:
    branches: [feat/api-gateway-foundation]
    paths:
      - 'workers/api-gateway/**'
      - '.github/workflows/api-gateway-tests.yml'
      - '.github/workflows/ltx-live-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'workers/api-gateway/**'
      - '.github/workflows/api-gateway-tests.yml'
      - '.github/workflows/ltx-live-smoke.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run API Gateway tests
        run: node --test workers/api-gateway/tests/*.test.js

  live-ltx-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify anonymous LTX session and encrypted query
        run: node workers/api-gateway/tests/live-ltx-smoke.mjs
